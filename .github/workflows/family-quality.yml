name: Web quality
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package*.json'
      - 'next.config.js'
      - '.github/workflows/family-quality.yml'
  push:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:family
      - run: npm run test:review
      - run: npm run test:analytics
      - run: npm run test:download
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
